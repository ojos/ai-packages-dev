name: review-gate

# リモート最終ゲート（Copilot code review）が**効かないまま PR が通ること**を塞ぐ。
# 規範: .ai-playbook/review-workflow.md「リモート最終ゲート」。
#
# **効かない形は 2 つある。**
#
#   1. **要求されていない**（もとからの目的。下記の「なぜ別のワークフローが要るか」）
#   2. **要求も投稿もされたが、1 行も読まれていない**（下記「2 段目」）
#
# **要求はしない。確かめるだけである。** 要求するのは copilot-review.yml で、
# あちらは `opened` に限って 1 回だけ動く（規範の「1 回だけ要求する」）。ここが
# 要求まで行うと、2 か所から要求が出て「1 回だけ」が壊れる。
#
# **なぜ別のワークフローが要るか。** `pull_request` の `opened` が届かないことが
# ある（ある利用プロジェクトの実運用では、連続する 2 日間に開いた 6 本のうち 2 本で
# 起動しなかった）。届かなければ copilot-review.yml は起動せず、しかし他のチェックは
# 緑なので、最終ゲートだけが黙って抜ける。
#
# **`opened` を見る 2 本目を足しても解決しない。** 届いていないのはイベントそのもの
# なので、同じ契機を見る側も同じように起動しない。**別の契機が要る**というのが
# このワークフローの設計上の核で、次の 3 つを張っている。
#
#   1. opened          —— 通常はここで片が付く（猶予を置いてから見る。下記）
#   2. synchronize 等  —— 1 が不発でも、次の push で拾う
#   3. schedule        —— 1 も 2 も来ない PR（開いたきり触っていない）を拾う
#
# **判定は commit status として head SHA へ付ける。** ジョブが落ちるだけでは、
# schedule から見た PR に何も現れない（実行がその PR に紐づかないため）。status に
# すれば、どの契機から判定しても同じ場所（PR の checks 欄）に出る。
#
# **required check にはしない。** レビュー機構側の遅延や障害でマージが止まる副作用が
# あるため。ここで止めたいのは「効いていないことに気づかないまま通ること」だけ
# である。
#
# **既知の限界: この確認側の run: ブロック自体は、同じリポジトリの PR から書き換え
# られる。** `pull_request` イベントで GitHub が実行するのは PR 側の版のワークフロー
# 定義であり、下記の checkout（既定ブランチ固定）が守るのは scripts/review-usable.sh
# だけである（詳細は checkout ステップのコメント）。この PR より前から存在する性質
# で、判定がまるごと YAML にあった頃から同じ大きさで開いていたため、本ファイルの
# 変更で後退はしていないが、閉じてもいない。塞ぐには信頼境界の設計変更が要り、
# 本ファイルのスコープを超える。
#
# **ただし、閉じていないことと無防備であることは同じではない。** 塞がないまま
# 受け入れているのは、下記の schedule が既にこの限界を上書きする性質を持つため
# である（規範: .ai-playbook/review-workflow.md「この機構が保証すること／しない
# こと: run: ブロックそのものの書き換え」）。
#
#   - `pull_request` 契機の判定経路は PR 側に握られている（上記のとおり）。
#   - `schedule`（下記 `cron: '*/20 * * * *'`）は既定ブランチの版で実行され、
#     open な PR を全件、既定ブランチの判定ロジックで判定し直す。PR 側の書き換えは
#     ここには届かない（実測: 手動 dispatch した schedule 相当の実行が、起動した
#     契機とは別の PR まで再判定し、status を書き換えた）。
#   - **したがって、捏造された status は次の schedule で上書きされる。**
#   - **ただし上書きまで最大 20 分は捏造された緑が見える。** その間にマージすれば
#     通る。**この窓は承知のうえで受け入れている。** 塞ぐには上記と同じ設計変更が
#     要る。
#
# ── 2 段目: 「要求されたか」と「読まれたか」は別である ──────────────────────────
#
# GitHub は 1 ファイルの差分が大きすぎると `patch` フィールドを落とす（実測:
# 48,036 B / 50,302 B のファイルは返り、105,251 B 相当は落ちた。行数ではない
# ——落ちた PR の `changes` は 36 行と 93 行だった）。`patch` の無いファイルしか
# 無い PR でも、Copilot は要求どおりレビューを投稿するが、中身は
# `Copilot wasn't able to review any files in this pull request.` の定型文だけに
# なる。要求も投稿も記録は残るため、「要求されたか」しか見ない判定はこの状態でも
# 緑を出し続ける。ある利用プロジェクトの実運用では、この形で複数本の PR が
# review-gate 緑のまま通過し、最初の 1 本から気づくまで 3 日かかった。
#
# **判定は scripts/review-usable.sh へ委ねる。** このワークフロー（.yml）は GitHub
# 上でしか実行できないため、判定をここへ埋めると受け入れ条件を機械的に確かめる
# 手段が無くなる。ここでは GitHub API から一覧を集めてあのスクリプトへ渡し、結果を
# commit status へ書くだけにしてある（詳細と入出力契約はスクリプト冒頭）。
#
# **既知の制約: 導入初回の PR では、既定ブランチではなく PR 自身の判定コードで
# 判定される。** 判定コードは既定ブランチから取る設計だが（下記 checkout ステップ）、
# `review-gate.yml` と `scripts/review-usable.sh` をまだ配置していないプロジェクトが
# `--with-copilot-review` を初めて採用する PR の時点では、その判定コード自身が
# 既定ブランチにまだ無い。この状態を検出したときだけ PR 側の写しへフォールバックする
# （resolve_usable_script）。フォールバックした旨は commit status の description と
# `::notice::` へ明示するため、黙って別の版で判定されたことにはならない。同じ理由で、
# **判定コードそのものを変更する PR も、その変更を PR 上では検証できない**
# （マージ後、次の実行から既定ブランチの新しい版で判定される）。

on:
  pull_request:
    # opened を入れているのは、届いたときに早く出したいからで、
    # 届かない場合の担保は下の schedule 側にある。
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 20 分ごと。opened も synchronize も来なかった PR を拾うための掃き寄せで、
    # 通常経路の速さはこれに依存しない。
    - cron: '*/20 * * * *'
  # 詰まったときに手で 1 回流せるようにしておく（受け入れ確認でも使う）。
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # timeline（`/issues/{n}/timeline`）を読む。**呼んでいる先の権限は宣言する。**
  # PR は issue でもあるため `pull-requests: read` だけでも読めることは実測されて
  # いるが、宣言を省くと、GitHub 側の扱いが変わった日に判定が全 PR で出なくなる。
  issues: read
  # commit status を書く。これが判定の出力先である。
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # フォークからの PR は copilot-review.yml が対象外にしている。要求されない
    # ものを「要求されていない」と落とすと、恒常的に赤いだけの状態になる。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout the default branch (not the PR under judgment)
        uses: actions/checkout@v4
        with:
          # **判定コード（scripts/review-usable.sh）は既定ブランチから取る。**
          # ref を指定しないと、checkout は pull_request イベントで PR のマージ結果
          # （PR 側のコード）を取得する。判定コードを被検査対象と同じ木から取ると、
          # PR の投稿者が scripts/review-usable.sh を書き換えるだけでこのゲートを
          # 常に緑にできてしまう。schedule / workflow_dispatch は元々既定ブランチを
          # 見るが、契機によって判定コードの出所が変わる状態を残さないため、
          # 3 つの契機すべてで明示的に固定する。
          #
          # **この checkout が守るのは scripts/review-usable.sh だけであり、この
          # ワークフロー定義（本ファイルの run: ブロック自体）ではない。**
          # `pull_request` イベントでは、同じリポジトリ内の PR に対して GitHub が
          # 実行するのは PR 側の版の workflow 定義である（既定ブランチの checkout
          # とは無関係に、GitHub 側がどのワークフロー定義を動かすかを決める）。
          # したがって、この PR の投稿者は `gather_files` / `gather_reviews` /
          # `report` / `case` などこの run: ブロックそのものを書き換えて、
          # `statuses: write` の権限のまま成功を捏造できる。**判定コードの出所を
          # 固定しても、この信頼境界は閉じていない。** 塞ぐには別の設計変更
          # （再利用可能ワークフローを既定ブランチ参照で呼ぶ、判定を schedule 実行
          # だけに限る等）が要り、本ファイルのスコープを超える。
          ref: ${{ github.event.repository.default_branch }}

      - name: Check that the remote final gate was actually requested and usable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # **式を run の中へ直接書かない。** GitHub は run を渡す前に文字列として
          # 置換するので、値に引用符が混ざればシェルの構文ごと変わりうる。加えて
          # `bash -n` は `${{ ... }}` を通してしまう（展開しないため）ので、
          # ワークフローの構文検査でも気づけない —— 実行して初めて
          # `bad substitution` になる。
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # copilot-review.yml が要求を出し切るまでの猶予（秒）。
          #
          # **opened では両方が同時に走る。** 猶予を置かないと、要求が届く前に
          # ここが見て「要求されていない」と落とす。落ちた status は次の契機まで
          # 赤いままなので、偽の赤を作らない側へ倒す。
          GRACE_SEC=120

          # PR が開かれてからこの秒数が経つまで、schedule では判定しない。
          # 上と同じ理由（開いた直後の PR を掃き寄せが追い越さないようにする）。
          SWEEP_MIN_AGE_SEC=180

          # status の名前。**変えると過去の PR に付いた status と別物になる。**
          CONTEXT="review-gate"

          # 既定ブランチ（このジョブが checkout 済みの木）に判定スクリプトが
          # あるか。ジョブの間じゅう不変なので、PR ごとではなくここで 1 度だけ見る。
          #
          # **無いことがある。** `review-gate.yml` は判定コードを既定ブランチから
          # 取る設計にしてあるが（このファイル冒頭の「2 段目」参照）、その判定コード
          # 自身（`scripts/review-usable.sh`）を配布物へ初めて足す PR の時点では、
          # 既定ブランチにまだ存在しない。**`--with-copilot-review` を新規に採用する
          # プロジェクトは、review-gate.yml と review-usable.sh を足す最初の PR で
          # 必ずこの状態を踏む。** 実際に、ある利用プロジェクトの導入直後の PR で
          # `bash: scripts/review-usable.sh: No such file or directory`（exit 127）が
          # 実測されている。
          #
          # このときだけ resolve_usable_script() が PR 側の写しへフォールバックする
          # （下記）。フォールバックしない場合、導入初回の PR は「確かめられなかった」
          # （status を付けない）扱いになり、外形的には fail-closed で安全だが、
          # **この機構自身を導入する PR がこの機構自身のゲートを一度も通せない**
          # という体験になる。
          if [ -f scripts/review-usable.sh ]; then
            HAS_MAIN_USABLE=1
          else
            HAS_MAIN_USABLE=0
          fi

          # scripts/review-usable.sh の実行元を決める。既定ブランチにあればそれを
          # そのまま返し（0 を返す）、無ければ PR 自身の写しを GitHub API から取得して
          # 一時ファイルへ書き、そのパスを返す。取得できなければ何も出力せず 1 を返す。
          #
          # **フォールバックしても「PR が自分の判定コードを書き換えてゲートを常に
          # 緑にする」問題は起きない。** 守りたいのは、判定コードが既定ブランチに
          # 存在するときにそれを差し替えられないことである。既定ブランチに判定コードが
          # まだ無い状態では、そもそも守るべき判定コードが存在しない。しかもこの状態は
          # PR からは作れない——既定ブランチから判定コードを消すには、その削除自体が
          # 別のレビューを通って既定ブランチへ入る必要がある。したがってフォールバックは
          # 「判定が一切走らず status も付かない」より厳密に良く、守りたい性質も壊さない。
          #
          # **既定ブランチにある場合は、絶対にフォールバックしない。** 条件は
          # `HAS_MAIN_USABLE` の 1 点だけで、PR 側の内容がどうであっても既定ブランチ
          # 側を優先する。これが崩れると、PR が既定ブランチにある判定コードを
          # 自分の写しで上書きできてしまう。
          #
          # **API 呼び出しが失敗しても、gather_files / gather_reviews のパイプへは
          # 進まない。** 呼び出し側は本関数の戻り値を確かめてから
          # `{ gather_files ...; gather_reviews ...; } | bash "$usable_script"` を
          # 組み立てるため、ここで 1 を返せばパイプ自体が作られない。判定スクリプトが
          # 見つからないまま起動を試みて SIGPIPE で落ちる経路（実測: `printf: write
          # error: Broken pipe`）は、この順序により再現しない。
          resolve_usable_script() {
            local sha="$1"
            if [ "$HAS_MAIN_USABLE" = "1" ]; then
              printf '%s' "scripts/review-usable.sh"
              return 0
            fi
            local tmp b64
            tmp="$(mktemp "${TMPDIR:-/tmp}/review-usable.XXXXXX")"
            if ! b64="$(gh api "repos/${REPO}/contents/scripts/review-usable.sh?ref=${sha}" \
                 --jq .content 2>/dev/null)" || [ -z "$b64" ]; then
              rm -f "$tmp"
              return 1
            fi
            if ! printf '%s' "$b64" | base64 -d > "$tmp" 2>/dev/null; then
              rm -f "$tmp"
              return 1
            fi
            printf '%s' "$tmp"
          }

          # レビューが要求されているか、あるいは既に付いているかを見る。
          #
          #   0 — 要求済みか投稿済み
          #   1 — どちらでもない（＝ 落とす）
          #   2 — **確かめられなかった**（API から読めない）
          #
          # **2 を 1 に混ぜない。** 読めなかったことを「要求されていない」として
          # 扱うと、GitHub が一時的に不調なだけで赤が出る。逆に握り潰して緑にすると、
          # 確かめていないものを通したことになる。どちらでもない第 3 の答えが要る。
          #
          # **`gh pr view --json reviewRequests` を使わない。** Copilot はそこに
          # 出ない（実測）。REST の 3 つを見る。
          #
          # **3 つ目（timeline）が要る理由。** requested_reviewers と reviews は
          # どちらも「いまの状態」を返すもので、**その 2 つがともに空になる窓が
          # ある。** Copilot はレビューを開始した時点で requested_reviewers から
          # 消え、投稿するまで reviews に現れない。ある利用プロジェクトの実運用
          # では、要求の 7 秒後に requested_reviewers から消え、投稿までの約 3 分間
          # どちらにも現れなかった。同じ日に開いた PR 2 本がともにこの窓の中で
          # 判定され、要求は成功しているのに failure が出ている。
          #
          # **GRACE_SEC を延ばしても抜けられない。** あの猶予が待っているのは
          # 「要求がまだ出ていない」場合で、この窓は要求が出た**後**にある。
          # 延ばすほど窓の中で判定することになる。
          #
          # timeline が返すのは「起きたこと」である。**要求されたという出来事は、
          # レビューがどこまで進んでも消えない**ため、進行状態に左右されない。
          has_review() {
            local pr="$1" requested reviews timeline
            # **終了コードで見る。`|| echo ''` で流さない。** gh は 404 のとき
            # エラー本文を stdout に出すため、握り潰すと `{"message":"Not Found",
            # "documentation_url":"..."}` がそのまま判定対象の文字列に入る。実際に
            # 混入することを実行して確認した。いまは偶然どの綴りにも当たらないが、
            # **本文に copilot の語が現れれば緑になる。**
            if ! requested="$(gh api "repos/${REPO}/pulls/${pr}/requested_reviewers" \
                 --jq '[.users[].login] | join(" ")' 2>/dev/null)"; then
              return 2
            fi
            if ! reviews="$(gh api --paginate "repos/${REPO}/pulls/${pr}/reviews" \
                 --jq '[.[].user.login] | join(" ")' 2>/dev/null)"; then
              return 2
            fi

            # 要求中（requested_reviewers に残っている）と、投稿済み（reviews に
            # 現れ、requested からは消えている）の**両方を通す**。片方だけ見ると、
            # レビューが付いた瞬間に赤へ変わる（実測: 投稿されると requested は
            # 空になり、reviews に現れる）。
            local name
            for name in $requested $reviews; do
              is_copilot "$name" && return 0
            done

            # ここまでで答えが出なかったときだけ timeline を読む。掃き寄せは open な
            # PR を全件見るので、既に答えの出ている PR にまで 1 本余計な呼び出しを
            # 払わせない。
            #
            # **ここでも終了コードで見る。読めなかったら 2 を返す。** 読めなかった
            # ことを「要求されていない」と同じに扱うと、上の 2 つで作らないように
            # している偽の赤を、3 つ目から作り直すことになる。
            #
            # チーム宛の要求（`requested_team`）は落とす。Copilot は利用者として
            # 要求されるため、`requested_reviewer` が null の出来事は判定材料に
            # ならない（`.requested_reviewer.login` を無条件に取ると null が
            # 空文字として並び、行の対応がずれる）。
            if ! timeline="$(gh api --paginate \
                 "repos/${REPO}/issues/${pr}/timeline?per_page=100" \
                 --jq '.[] | select(.event == "review_requested" or .event == "review_request_removed")
                           | select(.requested_reviewer != null)
                           | "\(.event) \(.requested_reviewer.login)"' 2>/dev/null)"; then
              return 2
            fi

            # **取り消しを勘定に入れる。** 出来事が残っていることだけを見ると、
            # 要求してすぐ取り消した PR も「要求された」になり、**要求を出して消す
            # だけでゲートが外れる。** timeline は時系列で返るので、同じ相手の
            # 最後の 1 件が review_requested のときだけ、要求が生きていると見る。
            #
            # なお **Copilot がレビューを始めて requested_reviewers から消えるとき
            # review_request_removed は出ない**（実測。上記 2 本で確認した）。
            # 進行中の窓と取り消しは、ここで別物として扱える。
            local ev login last=""
            while read -r ev login; do
              [ -n "${ev:-}" ] || continue
              is_copilot "$login" || continue
              last="$ev"
            done <<< "$timeline"
            if [ "$last" = "review_requested" ]; then
              return 0
            fi

            return 1
          }

          # 名前が Copilot のものか。**部分一致で見ない。**
          #
          # `*copilot*` で見ると、`copilot-fan` のような無関係な利用者がレビュアーに
          # 付いただけで「要求済み」になり、ゲートをすり抜ける。
          #
          # 綴りは 2 通りある（実測）。要求側は `Copilot`、投稿側は
          # `copilot-pull-request-reviewer[bot]`。**将来 GitHub が綴りを変えたら
          # 赤になる**が、それは安全側である —— 緑に倒れると、確かめていないものを
          # 通したことになる。
          is_copilot() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              copilot|"copilot-pull-request-reviewer[bot]") return 0 ;;
              *) return 1 ;;
            esac
          }

          # 変更ファイルの一覧を、scripts/review-usable.sh の入力形式（1 行 1
          # レコード）へ組み立てる。読めなければ 1 行 "patch-unknown" だけを返す
          # （あちらの契約）。
          gather_files() {
            local pr="$1" rows
            if ! rows="$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" \
                 --jq '.[] | "file \(.changes) " + (if .patch == null then "nopatch" else "patch" end)' 2>/dev/null)"; then
              echo "patch-unknown"
              return
            fi
            printf '%s\n' "$rows"
          }

          # 投稿された Copilot 自身のレビュー本文を、時系列順に review-usable.sh の
          # 入力形式へ組み立てる。読めなければ 1 行 "review-unknown" だけを返す。
          #
          # **発言者を Copilot に絞り込むのはここで行う。** review-usable.sh は
          # 「誰が投稿したか」を知らず、渡された本文をそのまま定型文と比較するだけに
          # なっている（判定の対象を狭めるのは呼び出し側の役割、定型文かどうかを
          # 見るのは判定側の役割、という分担）。is_copilot はここでも使い回す——
          # has_review と別に綴りを持つと、将来 GitHub が綴りを変えたときに片方だけ
          # 直し忘れる。
          #
          # 本文中の改行はスペースへ畳む。review-usable.sh の入力は 1 行 1 レコード
          # のため、改行を残すと 1 件のレビューが複数レコードに分裂する。定型文の
          # 一致は部分一致のままなので判定結果は変わらない。
          gather_reviews() {
            local pr="$1" rows login body
            if ! rows="$(gh api --paginate "repos/${REPO}/pulls/${pr}/reviews?per_page=100" \
                 --jq '.[] | "\(.user.login) " + ((.body // "") | gsub("\n";" "))' 2>/dev/null)"; then
              echo "review-unknown"
              return
            fi
            while read -r login body; do
              [ -n "${login:-}" ] || continue
              is_copilot "$login" || continue
              echo "review $body"
            done <<< "$rows"
          }

          # 判定を head SHA へ書く。**ジョブの成否ではなくこれが出力である。**
          #
          # **書けなかったら失敗を返す。`set -e` に任せない。** この関数は最終的に
          # `judge ... || failed=1` の左辺から呼ばれるが、`||` の左辺で呼ばれた関数の
          # 内側では `set -e` が無効になる（実測）。任せると、`gh api` が権限不足や
          # レート制限で落ちても次の `echo` が成功し、**status を書けていないのに緑**
          # になる。それはこのワークフローが塞ごうとしている失敗の仕方そのものである。
          report() {
            local sha="$1" state="$2" desc="$3"
            if ! gh api --method POST "repos/${REPO}/statuses/${sha}" \
              -f "state=${state}" \
              -f "context=${CONTEXT}" \
              -f "description=${desc}" \
              -f "target_url=${RUN_URL}" >/dev/null; then
              echo "::error::PR の head ${sha:0:7} へ status を書けませんでした。判定（${state}）は PR 上に出ていません。"
              return 1
            fi
            echo "  status=${state} sha=${sha:0:7} (${desc})"
          }

          # 1 本を判定する。通らなければ 1 を返す（呼び出し側が集計する）。
          judge() {
            local pr="$1" sha="$2" verdict=0
            # set -e に掛からない形で終了コードを取る。
            has_review "$pr" || verdict=$?

            case "$verdict" in
              0)
                # **要求も投稿もされている。ここからが 2 段目である。** 「要求
                # されたか」だけを見ていた頃、ある利用プロジェクトの実運用では、
                # 定型文しか投稿されない PR が review-gate 緑のまま複数本通過した。
                # **「レビューが付いた」を「読まれた」と読み替えない。**
                #
                # 判定そのものは scripts/review-usable.sh へ委ねる。ここでは
                # GitHub API から一覧を集めて渡し、結果を status へ書くだけにする。
                #
                # **`if ! var="$(...)"; then` の中で `$?` を拾わない。** `then` に
                # 入った時点の `$?` は `! ...` 自体の評価結果（常に 0）であり、
                # コマンド側が返した値ではない（実測: `f(){ return 3; }; if ! out="$(f)";
                # then rc=$?; fi` は rc=0 になる）。`|| var=$?` の形で拾う。
                #
                # 実行するスクリプトの場所は resolve_usable_script が決める（既定
                # ブランチ優先、無ければ PR 自身の写しへフォールバック。定義は本ファイル
                # 冒頭）。**解決できないうちは gather_files / gather_reviews のパイプを
                # 組み立てない。** 存在しないスクリプトへ向けてパイプを開くと、読み手が
                # 即死して書き手側が SIGPIPE で落ちる（実測: `printf: write error:
                # Broken pipe`）。順序を「解決 → 失敗ならここで return」にすることで、
                # この経路そのものを作らない。
                local usable_out usable_rc=0 usable_script usable_desc=""
                if ! usable_script="$(resolve_usable_script "$sha")"; then
                  echo "::error::PR #${pr}: scripts/review-usable.sh が既定ブランチにも PR 自身にも見つかりませんでした（読めなかった、または存在しません）。status は付けていません。次の定期実行で再判定します。"
                  return 1
                fi
                if [ "$HAS_MAIN_USABLE" != "1" ]; then
                  # **フォールバックしたことを明示する。** 黙って PR 側のコードで
                  # 判定すると、「既定ブランチの版で判定した」と読み違える。
                  usable_desc=" [fallback: judged with the PR's own review-usable.sh, not main]"
                  echo "::notice::PR #${pr}: 既定ブランチに scripts/review-usable.sh がまだ無いため、この PR 自身の写しで判定しました。review-gate.yml と review-usable.sh をこの PR で初めて導入する場合に必ず起きます。判定コードそのものの変更はこの PR 上では検証できていません（次に判定コードを変える PR も同様です）。"
                fi
                usable_out="$(
                  { gather_files "$pr"; gather_reviews "$pr"; } \
                    | bash "$usable_script"
                )" || usable_rc=$?
                # フォールバック時の一時ファイルだけ消す。既定ブランチの写し
                # （"scripts/review-usable.sh"）は checkout の一部なので消さない。
                [ "$HAS_MAIN_USABLE" = "1" ] || rm -f "$usable_script"
                echo "  review-usable: ${usable_out:-(no output)} (rc=${usable_rc})${usable_desc}"

                case "$usable_rc" in
                  0)
                    # report の失敗をそのまま返す。**書けたことまで含めて「通った」で
                    # ある。**
                    report "$sha" success "Copilot code review is requested or posted${usable_desc}" || return 1
                    return 0
                    ;;
                  1)
                    report "$sha" failure "No file patch available; Copilot cannot read this PR${usable_desc}" || return 1
                    echo "::error::PR #${pr}: 変更したどのファイルにも差分（patch）が付いていないため、Copilot は 1 行も読めません。GitHub は 1 ファイルの差分が大きすぎると patch を落とします（実測では 5 万バイト台は返り、10 万バイト台は落ちました）。確かめる: gh api repos/${REPO}/pulls/${pr}/files --jq '[.[] | select(.changes > 0 and .patch == null) | .filename]'。直す: 巨大な 1 行を分ける（その行を書き換えると旧＋新が差分に乗ります）、あるいは変更を複数の PR へ分ける。"
                    return 1
                    ;;
                  3)
                    report "$sha" failure "Copilot reviewed nothing (it could not read any file)${usable_desc}" || return 1
                    echo "::error::PR #${pr}: Copilot が「1 行も読めなかった」という定型文だけを返しました。要求も投稿もされていますが、中身がありません。上の patch の検査は通っているので、GitHub 側の挙動が変わったか、Copilot 側の事情です。マージする前に、別の手段（第二意見レビュー等）で代替するか、利用者に判断を仰いでください。"
                    return 1
                    ;;
                  *)
                    # **status を付けない**（下の `*` と同じ理由）。usable_rc が 2
                    # になるのは、files/reviews の一覧を API から読めなかったときと、
                    # 渡した入力の形が崩れていたとき。前者は一時的な不調、後者は
                    # このワークフロー自身の不具合だが、どちらも「確かめていない」
                    # 点は同じなので同じ扱いにする。
                    echo "::error::PR #${pr}: レビューが読まれたかを確かめられませんでした（GitHub API から読めない、または判定への入力が崩れています）。status は付けていません。次の定期実行で再判定します。"
                    return 1
                    ;;
                esac
                ;;
              1)
                # **書けなかったなら、そこで止める。** 続けて「レビューが要求されて
                # いません」と案内すると、原因が権限やレート制限（＝ status を書け
                # なかったこと）であるときに、**間違った診断と間違った手順を出す**
                # ことになる。report が既に何が起きたかを出しているので、重ねない。
                report "$sha" failure "Copilot code review was never requested (workflow misfire?)" || return 1
                echo "::error::PR #${pr}: リモート最終ゲート（Copilot code review）が要求されていません。pull_request の opened が届かなかった可能性があります。マージ前に 1 回だけ手で要求してください: gh api --method POST repos/${REPO}/pulls/${pr}/requested_reviewers -f 'reviewers[]=copilot-pull-request-reviewer[bot]'"
                return 1
                ;;
              *)
                # **status を付けない。** 緑も赤も、確かめた結果として出すもので
                # ある。確かめられなかったときに赤を出すと、GitHub の一時的な不調が
                # 「レビューが無い」として記録される。実行だけを落とし、判定は
                # 次の契機（20 分後の掃き寄せ）へ持ち越す。
                echo "::error::PR #${pr}: レビューの有無を確かめられませんでした（GitHub API から読めない）。status は付けていません。次の定期実行で再判定します。"
                return 1
                ;;
            esac
          }

          failed=0

          if [ "$EVENT" = "pull_request" ]; then
            # **猶予を置くのは opened のときだけ。** そこだけが
            # copilot-review.yml と同時に走るので、待たずに見ると必ず
            # 「要求されていない」になる。synchronize 以降は要求がとうに済んで
            # いる（か、済んでいないことが確定している）ので待つ理由が無く、
            # 待てば push のたびに待ち時間ぶんの実行時間を払うことになる。
            if [ "${ACTION:-}" = "opened" ]; then
              echo "PR #${PR_NUMBER} を判定します（要求が届くまで ${GRACE_SEC} 秒待ちます）"
              sleep "$GRACE_SEC"
            else
              echo "PR #${PR_NUMBER} を判定します"
            fi
            sha="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
            judge "$PR_NUMBER" "$sha" || failed=1
          else
            echo "open な PR を掃き寄せます"
            now="$(date -u +%s)"
            # **全件を見る。件数で打ち切らない。** ここは最後の担保なので、上限で
            # 切れた分は「判定されないまま status も付かない」＝ PR 上に何も現れない
            # という、この仕組みが塞ごうとしている状態そのものになる。しかも切り捨ては
            # 静かに起きる。
            #
            # `gh pr list --limit N` ではなく `gh api --paginate` を使うのは、前者が
            # 上限を要求するのに対し、後者は最後のページまで辿るためである。
            #
            # リポジトリ名は jq の `env` 経由で渡す（`gh api` に `--arg` は無く、
            # フィルタへ文字列連結で埋めると引用の扱いが 1 つ増える）。
            #
            # フォークからの PR は除く（copilot-review.yml と同じ扱い）。
            #
            # `.head.repo` の null を明示的に除く。**フォーク元のリポジトリが削除
            # されると null になる。** jq は null への参照をエラーにしないので
            # （`null | .full_name` は null、実測）書かなくても除外されるが、
            # 「そういう PR がありうる」ことが読み取れないと、次に触る人が
            # `.head.repo.full_name` を安全だと思って別の場所へ写す。
            if ! prs="$(gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo != null and .head.repo.full_name == env.REPO)
                        | "\(.number) \(.head.sha) \(.created_at)"' 2>/dev/null)"; then
              echo "::error::open な PR の一覧を取得できませんでした。今回は何も判定していません。"
              exit 1
            fi

            if [ -z "$prs" ]; then
              echo "  対象なし"
            fi

            while read -r pr sha created; do
              [ -n "${pr:-}" ] || continue
              age=$(( now - $(date -u -d "$created" +%s) ))
              if [ "$age" -lt "$SWEEP_MIN_AGE_SEC" ]; then
                echo "  PR #${pr}: 開いてから ${age} 秒。まだ判定しません"
                continue
              fi
              echo "  PR #${pr}:"
              # **掃き寄せでは 1 本の失敗で打ち切らない。** 残りが判定されないと、
              # その PR には status が付かないまま（＝ 何も出ない）になる。
              judge "$pr" "$sha" || failed=1
            done <<< "$prs"
          fi

          # **失敗を握り潰さない。** 判定が赤なら実行も赤にする。緑のまま status
          # だけ赤にすると、Actions の一覧から異常が読めなくなる。
          exit "$failed"
