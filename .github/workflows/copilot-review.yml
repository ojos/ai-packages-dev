name: copilot-review

# PR 作成時に一度だけ GitHub Copilot へコードレビューを自動要求する（リモート最終ゲート）。
# 規範: .ai-playbook/review-workflow.md（リモート最終ゲートは 1 回だけ要求する）。
#
# 一度だけ: types を opened に限定し、PR 更新（synchronize）では再要求しない。
# これが「1 回だけ」を運用者の記憶に頼らず機構で保証している実体。外から見える
# 要求（イベントの発火）はこの 1 本だけで、下記の再試行はこの 1 回の中で閉じる。
# 別のイベントから改めて要求する形にはしない。
#
# 前提:
#   - リポジトリ所有者の Copilot サブスクリプションで「Copilot code review」が有効なこと。
#     無効だと reviewers 要求が 422 で失敗する。
#   - 既定の GITHUB_TOKEN で要求できない場合は、リポジトリ Secrets に COPILOT_REVIEW_TOKEN
#     （pull-requests 書き込み権限を持つ PAT）を設定すれば自動で切り替わる。
#   - 要求は間欠的に空レスポンスで失敗することがある（下記ステップの再試行を参照）。
#
# 要求したことの確認は review-gate.yml が別の契機から行う。あちらは要求せず、
# 確かめるだけである（規範の「1 回だけ要求する」を 2 か所から壊さないため）。

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    # フォークからの PR は書き込みトークンを持たないためスキップする。
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Request a review from Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 要求は間欠的に失敗する。実測した失敗の形は
          # **空のレスポンス**で、gh がそれを JSON として解釈できず
          # `unexpected end of JSON input` で落ちる。同じトークン・同じ呼び出しが
          # 49 分後には成功しており、422（所有者側で無効）や 401/403（権限不足）の
          # ような恒常的な原因ではない。再現条件は分かっていない。
          #
          # 再試行はこのジョブの中で閉じる。別のイベントから要求し直す形にはしない。
          # 規範（.ai-playbook/review-workflow.md「リモート最終ゲート」）の
          # 「1 回だけ要求する」が禁じているのは要求が 2 か所（別のイベント）から
          # 出て二重要求になることで、成功するまでを 1 回の要求として扱うことは
          # 禁じていない。外から見た要求はこの 1 ジョブのみで最大 1 件のまま。
          #
          # 試行回数・間隔: 間欠故障を意図的に起こせず再現条件も無いため、狙って
          # 越えられる待ち時間は決められない。ここでは「同一プロセス内の瞬間的な
          # 不調なら数十秒あれば別の試行で通る」という見立てで、5→10→20 秒の
          # 指数バックオフで計 4 回まで試す（合計待機は最大 35 秒）。PR opened は
          # 頻繁に発火するイベントではないため、失敗時にこの程度待つことの費用は
          # 小さい。この回数・間隔が実際の間欠故障を越えられるかは検証できていない
          # （本票が保証しないこと）。
          attempt=1
          max_attempts=4
          delay=5
          while :; do
            if out="$(gh api --method POST \
              "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]' 2>&1)"; then
              echo "requested Copilot code review (attempt ${attempt}/${max_attempts}, once, on PR opened)"
              exit 0
            fi

            echo "$out"
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              break
            fi
            echo "::warning::Copilot code review の要求に失敗しました（試行 ${attempt}/${max_attempts}）。${delay} 秒後に再試行します。"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

          # **失敗を握り潰してスキップにはしない。** 再試行を尽くしてもなお失敗した
          # 場合、リモート最終ゲートが実行されていないのに緑を出すと、偽の緑と通過の
          # 区別が付かなくなる。それは review-gate.yml が塞ごうとしている状態と
          # 同じものを、こちら側で作ることにあたる。
          echo "::error::Copilot code review の要求に ${max_attempts} 回試行しても失敗しました。次の順に切り分けてください: (1) 直前の出力が空、または 'unexpected end of JSON input' の場合は間欠的な障害の可能性が高く、常設のトークン設定を疑う前に、時間を置いた手動要求または再実行を試してください。(2) 出力に 422 が含まれる場合は、リポジトリ所有者側で Copilot code review が有効か確認してください（無効だと 422 になります）。(3) 出力に 401 / 403 が含まれる場合は、リポジトリ Secrets に COPILOT_REVIEW_TOKEN（pull-requests 書き込み権限を持つ PAT）を設定してください。(4) リモート最終ゲートを機構で要求しない方針へ変えるなら、プロジェクト層の規範（リモート最終ゲート）を先に更新してください。"
          exit 1
