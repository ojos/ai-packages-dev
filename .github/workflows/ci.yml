name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck -x packages/devcontainer-bootstrap/bootstrap.sh packages/devcontainer-bootstrap/doctor.sh

  self-devcontainer:
    name: Self devcontainer credential isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # このリポジトリ自身の devcontainer も、生成物と同じ「資格情報をホストから
      # 注入しない」構造を保つ。remoteEnv は作業ディレクトリの受け渡しだけを担い、
      # ${localEnv:...} を 1 つでも足すと、その値がホスト OS から静かに流れ込む。
      - name: remoteEnv carries only LOCAL_WORKSPACE_FOLDER
        run: |
          keys="$(jq -r '.remoteEnv | keys | join(",")' .devcontainer/devcontainer.json)"
          if [ "$keys" != "LOCAL_WORKSPACE_FOLDER" ]; then
            echo "remoteEnv must contain only LOCAL_WORKSPACE_FOLDER, got: $keys"
            exit 1
          fi

      - name: No localEnv reference in devcontainer.json
        run: |
          if grep -q '${localEnv:' .devcontainer/devcontainer.json; then
            echo "host credential injection path found:"
            grep -n '${localEnv:' .devcontainer/devcontainer.json
            exit 1
          fi

      # 一時クローンでの commit は identity を明示する。global identity は
      # setup-git-identity.sh が削除するため、明示しないと exit 128 で止まる。
      - name: Release script commits with an explicit identity
        run: |
          if ! grep -q "git -c user.name=.*-c user.email=.* \\\\" scripts/release-packages.sh; then
            echo "scripts/release-packages.sh must commit with an explicit identity"
            exit 1
          fi

  dcb-tests:
    name: devcontainer-bootstrap tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash packages/devcontainer-bootstrap/tests/run-tests.sh

  consistency:
    name: Docs and catalog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CATALOG lists every tracked file
        run: |
          fail=0
          for f in $(git ls-files 'docs/*.md'); do
            grep -q "\`$f\`" docs/CATALOG.md || { echo "not listed in docs/CATALOG.md: $f"; fail=1; }
          done
          for f in $(git ls-files 'scripts/*.sh'); do
            grep -q "\`$f\`" scripts/CATALOG.md || { echo "not listed in scripts/CATALOG.md: $f"; fail=1; }
          done
          exit $fail

      - name: CATALOG has no dangling entries
        run: |
          fail=0
          for f in $(grep -o '`docs/[^`]*`' docs/CATALOG.md | tr -d '`'); do
            [ -e "$f" ] || { echo "listed but missing: $f"; fail=1; }
          done
          for f in $(grep -o '`scripts/[^`]*`' scripts/CATALOG.md | tr -d '`'); do
            [ -e "$f" ] || { echo "listed but missing: $f"; fail=1; }
          done
          exit $fail

      - name: Relative markdown links resolve
        run: |
          fail=0
          for f in $(git ls-files '*.md'); do
            d=$(dirname "$f")
            for l in $(grep -oE '\]\([^)#:]+\.md[)#]' "$f" | sed 's/^](//; s/[)#]$//'); do
              case "$l" in http*) continue ;; esac
              [ -f "$d/$l" ] || [ -f "$l" ] || { echo "dangling link: $f -> $l"; fail=1; }
            done
          done
          exit $fail

  neutrality:
    name: Package neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # プロジェクト固有の値がパッケージ層と規範層へ混入していないことを検証する。
      # 検査対象・除外条件の正本は scripts/check-neutrality.sh。CI・ローカルゲート
      # （scripts/acceptance.sh）・.github/PROJECT_DEFINITION.md のクイック検証が
      # 同じスクリプトを呼ぶため、条件が 3 箇所でずれることがない。
      - name: No project-specific names in packages or .ai-playbook
        run: bash scripts/check-neutrality.sh
