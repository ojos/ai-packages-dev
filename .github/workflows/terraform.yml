name: Terraform (public repositories)

# ojos の公開リポジトリ（配布先）の宣言（infra/github/）を、PR で plan し、main へのマージで
# apply する（#487）。方針は .github/project-ai-rules.md「外部サービスの状態管理」。
#
# - 状態ファイルは HCP Terraform（Execution Mode は Local）。HCP は置き場所としてだけ使い、
#   plan / apply はこのランナーの中で走る。
# - apply に要る GitHub の PAT（TF_GITHUB_PAT）は Actions の secret にだけ置く。手元の .env には
#   置かないので、手元からは apply できない。これが「Actions からだけ apply する」の担保である。
# - fmt / validate は資格情報が要らないので、ci.yml の terraform ジョブ（scripts/acceptance.sh が
#   ミラーする）で回す。ここは資格情報の要る plan / apply だけを持つ。

on:
  pull_request:
    paths:
      - "infra/github/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/github/**"
      - ".github/workflows/terraform.yml"
  # 契機のイベントが届かなかったときの手動の口（ci.yml と同じ理由）。
  # main で apply=true のときだけ apply し、それ以外は plan だけを行う。
  workflow_dispatch:
    inputs:
      apply:
        description: "main で apply する（false なら plan だけ）"
        type: boolean
        default: false

permissions:
  contents: read

# 同じ状態ファイルへの plan / apply を重ねない。HCP Terraform も状態をロックするが、
# 待ち合わせをロックの取り合いに任せず、ここで直列にする。途中で止めると状態の書き込みが
# 中断されうるので、新しい実行で古い実行を止めない。
concurrency:
  group: terraform-public-repositories
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: infra/github

jobs:
  plan-or-apply:
    name: Terraform plan / apply
    runs-on: ubuntu-latest
    # フォークからの PR では secret が渡らず、plan できない。このリポジトリは外部からの PR を
    # 受け付けない方針（CONTRIBUTING.md）なので、フォークは対象外にする。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # plan の結果を PR へコメントする。
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Decide mode
        id: mode
        run: |
          mode=plan
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then mode=apply; fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_APPLY" = "true" ]; then mode=apply; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"
        env:
          INPUT_APPLY: ${{ inputs.apply }}

      # secret が無いまま進むと、provider が匿名で読みにいき、権限不足とも未設定とも
      # 読めない失敗になる。先に名前を挙げて落とす。
      - name: Require secrets
        run: |
          missing=""
          [ -n "$TF_API_TOKEN" ] || missing="$missing TF_API_TOKEN"
          [ -n "$TF_GITHUB_PAT" ] || missing="$missing TF_GITHUB_PAT"
          if [ -n "$missing" ]; then
            echo "::error::Actions の secret が未設定です:$missing（infra/github/README.md）"
            exit 1
          fi
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_GITHUB_PAT: ${{ secrets.TF_GITHUB_PAT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          # plan の出力を自分で扱うので、ラッパー（stdout を出力変数へ写す）は使わない。
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir="$TF_DIR" init

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir="$TF_DIR" plan -no-color -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_PAT }}

      # 公開リポジトリを消す・作り直す plan は、apply の前に落とす。prevent_destroy も止めるが、
      # 設定から外れた場合に備えて、plan の中身そのものを確かめる（terraform_data の作り直しは
      # gh api を打ち直すだけなので対象にしない）。
      - name: Refuse to destroy repositories
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          bad="$(jq -r '.resource_changes[]? | select(.type == "github_repository") | select(.change.actions | index("delete")) | .address' "$RUNNER_TEMP/plan.json")"
          if [ -n "$bad" ]; then
            echo "::error::公開リポジトリを消す・作り直す plan です。apply しません:"
            printf '%s\n' "$bad"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_PAT }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Terraform plan（infra/github）"
            echo
            echo "commit: \`$HEAD_SHA\`"
            echo
            echo '```'
            # コメントの上限（65536 文字）に収める。全文は実行のログにある。
            tail -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
        env:
          # コメントはこのワークフローのトークンで書く（PAT には PR への書き込みを与えない）。
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Apply
        if: steps.mode.outputs.mode == 'apply'
        run: terraform -chdir="$TF_DIR" apply -no-color tfplan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_PAT }}
          # security.tf の terraform_data が gh api で使う。
          GH_TOKEN: ${{ secrets.TF_GITHUB_PAT }}
